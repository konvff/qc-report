services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: qcapp
      POSTGRES_PASSWORD: qcapp
      POSTGRES_DB: qc_reports
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://qcapp:qcapp@db:5432/qc_reports
      SECRET_KEY: local-dev-secret-change-me
      DEFAULT_ADMIN_EMAIL: admin@example.com
      DEFAULT_ADMIN_PASSWORD: admin123
    depends_on:
      - db
    volumes:
      - uploads:/app/app/uploads
      - generated:/app/app/generated

volumes:
  pgdata:
  uploads:
  generated:
